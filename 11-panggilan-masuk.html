<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeeMate – Panggilan masuk</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html{background:#000}body{margin:0;background:#0B0B0B}
a{color:inherit;text-decoration:none}
.pg{width:100%;max-width:420px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:28px 24px 104px;position:relative;overflow-x:hidden;background:#0B0B0B;color:#fff;font-family:'Plus Jakarta Sans','Segoe UI',Roboto,Arial,sans-serif}
.pg.auth{padding-bottom:32px}
.m{color:#B8B8B8}.pk{color:#FF80A8}.col{display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:10px;align-items:center}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.2}p{margin:0;line-height:1.45}
.c{background:#151515;border:1.5px solid #2B2B2B;border-radius:18px;padding:16px}
.in{width:100%;height:46px;border:1px solid #8C8C8C;border-radius:12px;background:#0B0B0B;padding:0 14px;font:inherit;font-size:15px;color:#fff}
.in::placeholder{color:#B8B8B8}.in:focus{outline:2px solid #FF80A8;outline-offset:1px}
.lb{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.b,.g{height:48px;border-radius:12px;font:inherit;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;width:100%;cursor:pointer}
.b{background:#FF80A8;color:#0B0B0B;border:0}.g{border:1.5px solid #fff;color:#fff;background:none}
.sm{height:40px;font-size:14px}
.t{background:#2A1620;color:#FF80A8;border-radius:12px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.av{border-radius:50%;background:#FF80A8;color:#0B0B0B;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.chip{height:34px;padding:0 14px;border:1.5px solid #8C8C8C;border-radius:17px;display:flex;align-items:center;font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:#FF80A8;border-color:#FF80A8;color:#0B0B0B}
.top{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:14px}
.tab{position:fixed;left:0;right:0;bottom:0;max-width:420px;margin:0 auto;height:76px;background:#101010;border-top:1.5px solid #2B2B2B;display:flex;justify-content:space-around;padding-top:10px;z-index:5}
.tab a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#B8B8B8;min-width:60px}.tab a.on{color:#FF80A8}
.otp{width:46px;height:56px;text-align:center;font-size:22px;font-weight:800;padding:0}
.bb{padding:10px 14px;border-radius:16px;max-width:78%;font-size:14px;line-height:1.4}
.bar{flex:1;height:5px;border-radius:3px;background:#2B2B2B}.bar.on{background:#FF80A8}.bar.ok{background:#5FD39A}
.ci{border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cv{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #2B2B2B}
</style>
</head>
<body>
<main class="pg vc">
<style>
html,body{height:100%;overflow:hidden}
.pg.vc{padding:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 30%,#2A1520 0%,#0B0B0B 70%)}
.vtop{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center}
.pill{background:rgba(255,255,255,.08);border:1px solid #3A3A3A;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:700}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;text-align:center}
.ring{position:absolute;top:0;left:0;width:140px;height:140px;border-radius:50%;border:2px solid #FF80A8;opacity:0;animation:pu 2s infinite}.ring.r2{animation-delay:.8s}
@keyframes pu{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.conn .ring{display:none}
@media(prefers-reduced-motion:reduce){.ring{animation:none;display:none}}
.self{position:absolute;right:18px;bottom:18px;width:104px;height:140px;border-radius:18px;border:2px solid #fff;background:#1D1D1D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:700;text-align:center;padding:6px}
.ctl{display:flex;justify-content:center;gap:16px;padding:18px 12px 30px;background:#101010;border-top:1.5px solid #2B2B2B}
.cb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#B8B8B8;width:64px}
.cb button,.cb a{width:58px;height:58px;border-radius:50%;border:1.5px solid #8C8C8C;background:#151515;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.cb button[aria-pressed=true]{background:#fff;color:#0B0B0B;border-color:#fff}
.cb .end{background:#E5384B;border-color:#E5384B;color:#fff}.cb .ok{background:#FF80A8;border-color:#FF80A8;color:#0B0B0B}
.sl{display:none}[aria-pressed=true] .sl{display:block}
</style><div class="vtop"><span class="row"><span style="display:flex"><img src="logo.png" alt="Logo BeeMate" width="32" height="32" style="border-radius:50%;display:block"></span><b>BeeMate</b></span><span class="pill">Video call</span></div><div class="stage" id="stage"><div style="position:relative;width:140px;height:140px"><span class="ring"></span><span class="ring r2"></span><div class="av" style="width:140px;height:140px;font-size:50px;position:relative">NA</div></div><h1 style="margin-top:14px">Nadia A.</h1><div class="m" id="st" role="status" aria-live="polite" style="font-size:15px">Panggilan video masuk</div><span class="pill" style="color:#5FD39A">✓ Terverifikasi BINUS</span></div><div class="ctl" style="gap:56px;padding-bottom:34px"><div class="cb"><a class="end" href="8-chat.html" aria-label="Tolak panggilan"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14c5-5 13-5 18 0l-2 3.5-3.5-1.2v-2.6c-2-.8-4-.8-6 0v2.6L5 17.5z"/></svg></a>Tolak</div><div class="cb"><a class="ok" href="10-video-call.html?connected=1" aria-label="Terima panggilan video"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="13" height="12" rx="2.5"/><path d="M15 10.5l6-3.5v10l-6-3.5"/></svg></a>Terima</div></div>
</main>
</body>
</html>
